<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E60012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TOILET FINDER">
<meta name="mobile-web-app-capable" content="yes">
<title>TOKYO TOILET FINDER</title>
<meta name="description" content="Googleより詳しい、旅行者向け東京トイレデータベース。漏れそうな時に、いちばん近いトイレへ。">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-mark">TOKYO</span><span class="brand-mark brand-mark--fill">TOILET</span><span class="brand-mark">FINDER</span>
  </div>
  <button id="langToggle" class="lang-toggle" type="button" aria-label="Switch language">EN</button>
</header>

<nav class="city-bar" id="cityBar" aria-label="City selector"></nav>

<div id="offlineBanner" class="offline-banner hidden">📡 オフラインです（保存済みデータを表示しています）</div>
<div id="installBanner" class="install-banner hidden">
  <span id="installText">ホーム画面に追加すると次から早く開けます</span>
  <button id="installBtn" class="install-btn" type="button">追加する</button>
  <button id="installDismiss" class="install-dismiss" type="button" aria-label="Dismiss">✕</button>
</div>

<main id="app">

  <section id="emergencyZone" class="emergency-zone">
    <div class="sos-wrap">
      <button id="emergencyBtn" class="sos-btn" type="button">
        <span class="sos-flash" id="sosFlash" aria-hidden="true"></span>
        <span class="sos-btn__sos">🆘 SOS‼️</span>
        <span class="sos-btn__mid" id="emergencyLabel">🚽 漏れそう‼️</span>
        <span class="sos-btn__sub" id="emergencyHint">押すだけ。徒歩最短の神トイレへ。</span>
      </button>
    </div>
  </section>

  <section id="emergencyResults" class="emergency-results hidden" aria-live="assertive"></section>

  <section id="browseZone" class="browse-zone">
    <div class="toolbar">
      <input id="searchInput" class="search-input" type="search" placeholder="施設名・エリアで検索…" />
      <select id="areaSelect" class="area-select" aria-label="Area filter"></select>
    </div>

    <div class="chip-row" id="viewModeChips">
      <button id="viewBrowse" class="chip" type="button" data-active="true">📋 一覧</button>
      <button id="viewRanking" class="chip" type="button" data-active="false">🏆 神トイレランキング</button>
    </div>

    <div id="filterControls">
      <div class="chip-row" id="quickFilters">
        <button id="filter24h" class="chip" type="button" data-active="false">🕐 24時間</button>
        <button id="filterWheelchair" class="chip" type="button" data-active="false">♿ バリアフリー</button>
        <button id="filterBaby" class="chip" type="button" data-active="false">👶 ベビー設備</button>
      </div>

      <div class="chip-row" id="rankChips"></div>

      <div id="categoryChips" class="chip-row" role="tablist" aria-label="Category filter"></div>
    </div>

    <div id="resultMeta" class="result-meta"></div>
    <div id="listContainer" class="list-container"></div>
  </section>

</main>

<div id="detailSheet" class="detail-sheet hidden">
  <div class="detail-sheet__panel">
    <button id="detailClose" class="detail-sheet__close" type="button" aria-label="Close">✕</button>
    <div id="detailContent"></div>
  </div>
</div>

<footer class="app-footer">
  <p id="footerNote">AI HUNTER FACTORY100｜データは有志収集ベース（COMMUNITY）。営業時間・設備は現地で要確認。</p>
</footer>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
